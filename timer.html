<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="마주온 디지털 다도실 — 커피를 내리는 시간을 재는 3D 다도 타이머.">
<title>다도 타이머 | MAJUON</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#000000; height:100%; touch-action: none; width:100%; position:fixed; }
  canvas { display:block; width:100% !important; height:100% !important; }

  #loadingOverlay {
    position:fixed; inset:0; background:#000000; color:#eee;
    display:flex; align-items:center; justify-content:center;
    font-family: -apple-system, sans-serif; font-size:14px; letter-spacing:0.05em;
    z-index:100; transition: opacity 0.4s ease;
  }

  /* 화면을 터치하세요: 천천히 깜빡이는 안내 문구 */
  #touchPrompt {
    position:fixed; inset:0;
    display:none;
    align-items:center; justify-content:center;
    color:#f5f0e8;
    font-family: -apple-system, sans-serif;
    font-size: clamp(16px, 3vw, 22px);
    letter-spacing: 0.12em;
    text-shadow: 0 2px 4px rgba(0,0,0,0.95), 0 4px 24px rgba(0,0,0,0.9), 0 0 45px rgba(0,0,0,0.75);
    z-index: 50;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  #touchPrompt.show {
    display: flex;
    opacity: 1;
    animation: touchBlink 3.2s ease-in-out infinite;
  }
  @keyframes touchBlink {
    0%, 100% { opacity: 0.65; }
    50% { opacity: 1; }
  }

  /* 중앙 정렬 스텝 안내 텍스트 (제목 + 설명) */
  #stepTextOverlay {
    position: fixed; left:0; right:0; top: 38%; transform: translateY(-50%);
    text-align: center;
    color: #f5f0e8;
    font-family: -apple-system, sans-serif;
    text-shadow: 0 2px 4px rgba(0,0,0,0.95), 0 4px 24px rgba(0,0,0,0.9), 0 0 45px rgba(0,0,0,0.75);
    z-index: 15;
    opacity: 0; pointer-events: none;
    transition: opacity 1s ease;
    padding: 0 24px;
  }
  #stepTextOverlay.show { opacity: 1; }
  #stepTitleText {
    font-size: clamp(18px, 4vw, 26px); font-weight:700; letter-spacing:0.08em;
    margin-bottom: 12px;
  }
  #stepCaptionText {
    font-size: clamp(13px, 2.4vw, 16px); line-height:1.8; color:#d8d0c0;
  }
  #dragHint {
    position: fixed; left: 0; right: 0; bottom: 10%;
    text-align: center;
    display: none;
    font-size: clamp(13px, 2.4vw, 16px);
    letter-spacing: 0.1em;
    color: #f5f0e8;
    opacity: 1;
    text-shadow: 0 2px 4px rgba(0,0,0,0.95), 0 4px 20px rgba(0,0,0,0.9);
    pointer-events: none;
    z-index: 15;
  }
  #dragHint.show { display: block; }

  /* 상단 타이머 */
  #timerDisplay {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    color: #f5f0e8; font-family: -apple-system, sans-serif;
    font-size: clamp(24px, 5vw, 32px); font-weight:600; letter-spacing:0.08em;
    text-shadow: 0 2px 4px rgba(0,0,0,0.95), 0 4px 24px rgba(0,0,0,0.9), 0 0 45px rgba(0,0,0,0.75);
    z-index: 20;
    opacity: 0; pointer-events:none;
    transition: opacity 0.6s ease;
  }
  #timerDisplay.show { opacity: 1; }

  /* 버튼 UI 공통 스타일 */
  #startBtn, #nextBtn, #pauseBtn {
    position: fixed; top: 76px; left: 50%; transform: translateX(-50%);
    padding: 10px 28px;
    background: rgba(20,16,12,0.65);
    border: 1.5px solid rgba(245,240,232,0.85);
    border-radius: 999px;
    color: #f5f0e8;
    font-family: -apple-system, sans-serif;
    font-size: 14px; letter-spacing: 0.12em;
    z-index: 20;
    opacity: 0; pointer-events: none;
    transition: opacity 0.6s ease, background 0.2s ease;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(0,0,0,0.5);
  }
  #startBtn.show, #nextBtn.show, #pauseBtn.show { opacity: 1; pointer-events: auto; }
  #startBtn:hover, #nextBtn:hover, #pauseBtn:hover { background: rgba(20,16,12,0.85); }

  .tearoom-back{position:fixed;top:16px;left:16px;z-index:60;color:#e9ded0;text-decoration:none;font:14px/1 -apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;letter-spacing:.02em;padding:10px 14px;background:rgba(23,20,17,.55);border:1px solid rgba(233,222,208,.25);border-radius:999px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .2s ease,background .2s ease}
  .tearoom-back:hover{background:rgba(23,20,17,.8)}
  @media (max-width:720px){
    .tearoom-back{padding:10px 13px}
    .tearoom-back-label{display:none}
  }
</style>
</head>
<body>
<a class="tearoom-back" href="tearoom.html">← <span class="tearoom-back-label">다도실로 돌아가기</span></a>
<div id="loadingOverlay">타이머 불러오는 중...</div>
<div id="touchPrompt">화면을 터치하세요</div>

<div id="stepTextOverlay">
  <div id="stepTitleText">뜸들이기</div>
  <div id="stepCaptionText">커피 가루가 전체적으로 촉촉하게 젖을 만큼만<br>아주 적은 양의 물을 붓고 가만히 기다립니다.</div>
</div>
<div id="dragHint">터치하여 화면을 움직여 보세요</div>

<div id="timerDisplay">00:30</div>
<button id="startBtn">시작</button>
<button id="pauseBtn">일시정지</button>
<button id="nextBtn">다음</button>

<!-- GSAP 전역 로드 -->
<script src="js/timer-vendor/gsap/gsap.min.js"></script>

<!-- Three.js ESM 모듈 -->
<script type="importmap">
{
  "imports": {
    "three": "./js/timer-vendor/three/three.module.js",
    "three/addons/": "./js/timer-vendor/three/examples/jsm/"
  }
}
</script>

<!-- 분리된 JS 파일 연결 -->
<script type="module" src="js/timer.js"></script>

</body>
</html>
