<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마주온 — 스크롤 전환 목업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body, a, button, .frame {
    cursor: none;
  }
  #customCursor {
    position: fixed; top: 0; left: 0;
    width: 43px; height: 43px;
    pointer-events: none; z-index: 9999;
    mix-blend-mode: difference;
    transform: translate(-9999px, -9999px);
    will-change: transform;
  }
  html, body {
    margin: 0; padding: 0;
    background: #ffffff;
    font-family: "Noto Serif KR", "Batang", "바탕", serif;
    color: #171310;
    height: 100%;
  }
  html {
    scroll-snap-type: y mandatory;
  }

  /* ---------- 히어로: 스크롤하면 자연스럽게 사라지는 섹션 (핀 고정 없음) ---------- */
  #hero {
    height: 100vh; display: flex; flex-direction: column;
    will-change: opacity;
    scroll-snap-align: start;
    scroll-snap-stop: always;
  }

  main {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px 20px 40px;
  }
  .art-wrap { position: relative; display: flex; flex-direction: column; align-items: center; }

  .frame {
    width: min(70vmin, 620px);
    height: min(70vmin, 620px);
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(23,19,16,0.12);
    cursor: pointer;
    z-index: 1;
  }
  canvas { width: 100%; height: 100%; display: block; }

  .gallery-caption {
    margin-top: 22px;
    font-family: "Noto Serif KR", "Batang", "바탕", serif;
    font-style: italic;
    font-size: 12px;
    letter-spacing: 0.03em;
    color: rgba(23,19,16,0.38);
  }
  .scroll-hint {
    margin-top: 40px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .scroll-hint span {
    font-size: 16px; color: rgba(23,19,16,0.45); letter-spacing: 0.14em;
  }
  .chevrons {
    display: flex; flex-direction: column; align-items: center; gap: 1px;
  }
  .chevrons svg {
    width: 16px; height: 9px;
    opacity: 0;
    animation: chevronFlow 1.8s infinite;
  }
  .chevrons svg:nth-child(1) { animation-delay: 0s; }
  .chevrons svg:nth-child(2) { animation-delay: 0.22s; }
  .chevrons svg:nth-child(3) { animation-delay: 0.44s; }

  @keyframes chevronFlow {
    0%   { opacity: 0;   transform: translateY(-4px); }
    45%  { opacity: 0.9; transform: translateY(0); }
    100% { opacity: 0;   transform: translateY(5px); }
  }

  #quote {
    height: 100vh; display: flex; align-items: flex-start; justify-content: flex-end;
    padding: 64px 12% 60px 20px;
    background: #ffffff;
    position: relative;
    overflow: hidden;
    scroll-snap-align: start;
    scroll-snap-stop: always;
  }
  /* 스크롤하면 왼쪽 아래에서 검은 원이 커지며 화면을 덮는 리빌 */
  .reveal-circle {
    position: absolute; top: 0; right: 0;
    width: 198vmax; height: 198vmax;
    background: #0e0d0c;
    border-radius: 50%;
    transform: translate(50%, -50%) scale(0);
    z-index: 1; will-change: transform;
  }

  .quote-block {
    position: relative; z-index: 2;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    display: flex;
    gap: 34px;
    height: 100%;
    max-height: calc(100vh - 160px);
  }
  .quote-block p {
    font-family: "Noto Serif KR", "Batang", "바탕", serif;
    font-weight: 300;
    font-size: clamp(15px, 1.8vw, 21px);
    line-height: 1.75;
    letter-spacing: 0.12em;
    color: #ffffff;
    margin: 0;
  }
  .quote-mark {
    font-weight: 400;
    color: #ffffff;
  }

  /* 원이 다 차오른 뒤에만 나타나는, 이 페이지의 의도적인 다음 행동 제안 (모던한 산세리프로 대비) */
  .quote-cta {
    position: absolute; right: 12%; bottom: 9%; z-index: 3;
    display: flex; flex-direction: column; align-items: flex-end; gap: 18px;
    opacity: 0; transform: translateY(10px);
    transition: opacity 0.6s ease, transform 0.6s ease;
    pointer-events: none;
  }
  .quote-cta.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .quote-cta-eyebrow {
    font-family: -apple-system, "Noto Sans KR", sans-serif;
    font-size: 10px; letter-spacing: 0.22em;
    color: rgba(242,236,224,0.5);
    margin-bottom: -4px;
  }
  .quote-cta a {
    position: relative;
    display: inline-block;
    font-family: -apple-system, "Noto Sans KR", sans-serif;
    font-weight: 400;
    font-size: 15px;
    letter-spacing: 0.01em;
    text-decoration: none;
    padding-bottom: 8px;
  }
  .cta-label-wrap { position: relative; display: inline-block; }
  .cta-label {
    display: block;
    color: #f2ece0;
    transition: color 0.3s ease;
  }
  .quote-cta a:hover .cta-label { color: #ffffff; }
  .cta-label-fill {
    position: absolute; top: 0; left: 0; white-space: nowrap;
    background: linear-gradient(135deg, #2fadcf, #d1bada, #a2c3e7, #f9d2dc, #bcbcd7, #94bfe6, #a691be);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    clip-path: inset(0 100% 0 0);
    transition: clip-path 0.5s cubic-bezier(.4,0,.2,1);
  }
  .quote-cta a:hover .cta-label-fill { clip-path: inset(0 0% 0 0); }
  .cta-track {
    position: absolute; left: 0; bottom: 0; width: 100%; height: 1px;
    background: rgba(242,236,224,0.55);
    overflow: hidden;
  }
  .cta-track::after {
    content: ""; position: absolute; top: 0; left: -40%;
    width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
    animation: ctaShimmer 3.2s ease-in-out infinite;
  }
  @keyframes ctaShimmer {
    0%   { left: -40%; }
    55%  { left: 100%; }
    100% { left: 100%; }
  }
  .cta-ink {
    position: absolute; left: 0; bottom: 0; height: 1px; width: 100%;
    background: linear-gradient(90deg, #2fadcf, #a2c3e7, #f9d2dc, #bcbcd7, #a691be);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.5s cubic-bezier(.4,0,.2,1);
  }
  .quote-cta a:hover .cta-ink { transform: scaleX(1); }
  .cta-octagon {
    position: absolute; bottom: -6px; left: -6px;
    width: 12px; height: 12px;
    opacity: 0;
    transition: left 0.5s cubic-bezier(.4,0,.2,1), opacity 0.2s ease;
  }
  .cta-octagon svg { width: 100%; height: 100%; display: block; }
  .cta-octagon-fill {
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .quote-cta a:hover .cta-octagon {
    opacity: 1;
    left: calc(100% - 6px);
  }
  .quote-cta a:hover .cta-octagon-fill { opacity: 1; }

  /* ---------- 상단 바 (배경 없이 로고+내비만, 배경색과 상관없이 보이도록 blend) ---------- */
  .site-header {
    position: fixed; top: 0; left: 0; width: 100%; z-index: 50;
    opacity: 0; transform: translateY(-6px); pointer-events: none;
    transition: opacity 0.45s ease, transform 0.45s ease;
  }
  .site-header.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .site-header-inner {
    max-width: 1160px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px;
  }
  .site-logo { display: flex; align-items: center; }
  .site-logo img { height: 49px; width: auto; display: block; }
  .site-nav { display: flex; align-items: center; gap: 10px; }
  .site-nav a, .site-nav .dot {
    color: #171310;
    transition: color 0.3s ease;
  }
  .site-header.on-dark .site-nav a, .site-header.on-dark .site-nav .dot {
    color: #ffffff;
  }
  .site-nav a {
    text-decoration: none;
    font-size: 15px; letter-spacing: 0.06em;
  }
  .site-nav .dot { font-size: 10px; }
  .hamburger {
    display: none; flex-direction: column; justify-content: center; gap: 5px;
    width: 30px; height: 30px; background: none; border: none; cursor: pointer; padding: 0;
  }
  .hamburger span {
    width: 100%; height: 1px; display: block;
    background: #171310;
    transition: background 0.3s ease;
  }
  .site-header.on-dark .hamburger span { background: #ffffff; }
  .mobile-nav {
    display: none; flex-direction: column;
    max-width: 1160px; margin: 0 auto;
    padding: 0 28px 16px;
    background: #ffffff;
  }
  .mobile-nav a {
    padding: 13px 0; color: rgba(23,19,16,0.6); text-decoration: none;
    font-size: 15px; letter-spacing: 0.08em;
    border-top: 1px solid rgba(23,19,16,0.08);
  }
  .mobile-nav.open { display: flex; }

  @media (max-width: 720px) {
    .site-nav { display: none; }
    .hamburger { display: flex; }
  }

  /* 아주 좁은 화면에서만 문구가 넘치지 않도록 살짝 더 줄임 (정렬 자체는 이제 항상 동일) */
  @media (max-width: 480px) {
    .quote-block p { font-size: 12px; line-height: 1.55; letter-spacing: 0.06em; }
  }
  /* 모바일(햄버거 드롭다운이 뜨는 폭)에서만 위쪽 여백을 더 넉넉히 둬서, 드롭다운이 열려도
     문구가 겹치지 않게 함 — 정렬 방식은 안 바뀌고 여백 수치만 다름 */
  @media (max-width: 720px) {
    #quote { padding-top: 100px; }
  }
</style>
</head>
<body>

<div id="customCursor">
  <svg width="43" height="43" viewBox="0 0 48 48">
    <path d="M29.74,10.14 L37.86,18.26 L37.86,29.74 L29.74,37.86 L18.26,37.86 L10.14,29.74 L10.14,18.26 L18.26,10.14 Z" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>
</div>

<header class="site-header" id="siteHeader">
  <div class="site-header-inner">
    <a href="index.html" class="site-logo"><img src="가로로고.svg" alt="마주온"></a>
    <nav class="site-nav">
      <a href="story.html">스토리</a>
      <span class="dot">·</span>
      <a href="menu.html">메뉴</a>
      <span class="dot">·</span>
      <a href="store.html">스토어</a>
      <span class="dot">·</span>
      <a href="#">디지털 다도실</a>
    </nav>
    <button class="hamburger" id="hamburgerBtn" aria-label="메뉴 열기" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
  <nav class="mobile-nav" id="mobileNav">
    <a href="story.html">스토리</a>
    <a href="menu.html">메뉴</a>
    <a href="store.html">스토어</a>
    <a href="#">디지털 다도실</a>
  </nav>
</header>

<section id="hero">
  <main>
    <div class="art-wrap">
      <div class="frame" id="frame">
        <canvas id="c"></canvas>
      </div>
    </div>
    <div class="gallery-caption">《마주온 커피, 2026》 — 인터랙티브 캔버스</div>
    <div class="scroll-hint">
      <span>스크롤을 내리세요</span>
      <div class="chevrons">
        <svg viewBox="0 0 24 12"><path d="M2,2 L12,9 L22,2" fill="none" stroke="#171310" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg viewBox="0 0 24 12"><path d="M2,2 L12,9 L22,2" fill="none" stroke="#171310" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg viewBox="0 0 24 12"><path d="M2,2 L12,9 L22,2" fill="none" stroke="#171310" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
  </main>
</section>

<section id="quote">
  <div class="reveal-circle" id="revealCircle"></div>
  <div class="quote-block">
    <p><span class="quote-mark">『</span>마시는 종류만 달라졌을 뿐,</p>
    <p>즐기던 풍류는 마주해옵니다<span class="quote-mark">』</span></p>
  </div>
  <div class="quote-cta" id="quoteCta">
    <span class="quote-cta-eyebrow">NEXT</span>
    <a href="story.html">
      <span class="cta-label-wrap">
        <span class="cta-label">이야기가 궁금하다면 — 스토리</span>
        <span class="cta-label cta-label-fill">이야기가 궁금하다면 — 스토리</span>
      </span>
      <span class="cta-track"></span>
      <span class="cta-ink"></span>
      <span class="cta-octagon">
        <svg viewBox="0 0 32 32">
          <defs>
            <linearGradient id="ctaGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#2fadcf"/>
              <stop offset="20%" stop-color="#d1bada"/>
              <stop offset="40%" stop-color="#a2c3e7"/>
              <stop offset="55%" stop-color="#f9d2dc"/>
              <stop offset="70%" stop-color="#bcbcd7"/>
              <stop offset="85%" stop-color="#94bfe6"/>
              <stop offset="100%" stop-color="#a691be"/>
            </linearGradient>
          </defs>
          <path d="M20.97,3.99 L28.01,11.03 L28.01,20.97 L20.97,28.01 L11.03,28.01 L3.99,20.97 L3.99,11.03 L11.03,3.99 Z" fill="#ffffff"/>
          <path class="cta-octagon-fill" d="M20.97,3.99 L28.01,11.03 L28.01,20.97 L20.97,28.01 L11.03,28.01 L3.99,20.97 L3.99,11.03 L11.03,3.99 Z" fill="url(#ctaGrad1)"/>
        </svg>
      </span>
    </a>
    <a href="#">
      <span class="cta-label-wrap">
        <span class="cta-label">자리에 앉아보고 싶다면 — 디지털 다도실</span>
        <span class="cta-label cta-label-fill">자리에 앉아보고 싶다면 — 디지털 다도실</span>
      </span>
      <span class="cta-track"></span>
      <span class="cta-ink"></span>
      <span class="cta-octagon">
        <svg viewBox="0 0 32 32">
          <defs>
            <linearGradient id="ctaGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#2fadcf"/>
              <stop offset="20%" stop-color="#d1bada"/>
              <stop offset="40%" stop-color="#a2c3e7"/>
              <stop offset="55%" stop-color="#f9d2dc"/>
              <stop offset="70%" stop-color="#bcbcd7"/>
              <stop offset="85%" stop-color="#94bfe6"/>
              <stop offset="100%" stop-color="#a691be"/>
            </linearGradient>
          </defs>
          <path d="M20.97,3.99 L28.01,11.03 L28.01,20.97 L20.97,28.01 L11.03,28.01 L3.99,20.97 L3.99,11.03 L11.03,3.99 Z" fill="#ffffff"/>
          <path class="cta-octagon-fill" d="M20.97,3.99 L28.01,11.03 L28.01,20.97 L20.97,28.01 L11.03,28.01 L3.99,20.97 L3.99,11.03 L11.03,3.99 Z" fill="url(#ctaGrad2)"/>
        </svg>
      </span>
    </a>
  </div>
</section>


<script src="main.js"></script>
</body>
</html>
