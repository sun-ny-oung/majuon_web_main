<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마주온 — 스크롤 전환 목업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body, a, button, .frame {
    cursor: none;
  }
  #customCursor {
    position: fixed; top: 0; left: 0;
    width: 43px; height: 43px;
    pointer-events: none; z-index: 9999;
    mix-blend-mode: difference;
    transform: translate(-9999px, -9999px);
    will-change: transform;
  }
  html, body {
    margin: 0; padding: 0;
    background: #ffffff;
    font-family: "Noto Serif KR", "Batang", "바탕", serif;
    color: #171310;
    height: 100%;
  }
  html {
    scroll-snap-type: y mandatory;
  }

  /* ---------- 히어로: 스크롤하면 자연스럽게 사라지는 섹션 (핀 고정 없음) ---------- */
  #hero {
    height: 100vh; display: flex; flex-direction: column;
    will-change: opacity;
    scroll-snap-align: start;
    scroll-snap-stop: always;
  }

  main {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px 20px 40px;
  }
  .art-wrap { position: relative; display: flex; flex-direction: column; align-items: center; }

  .frame {
    width: min(70vmin, 620px);
    height: min(70vmin, 620px);
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(23,19,16,0.12);
    cursor: pointer;
    z-index: 1;
  }
  canvas { width: 100%; height: 100%; display: block; }

  .gallery-caption {
    margin-top: 22px;
    font-family: "Noto Serif KR", "Batang", "바탕", serif;
    font-style: italic;
    font-size: 12px;
    letter-spacing: 0.03em;
    color: rgba(23,19,16,0.38);
  }
  .scroll-hint {
    margin-top: 40px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .scroll-hint span {
    font-size: 16px; color: rgba(23,19,16,0.45); letter-spacing: 0.14em;
  }
  .chevrons {
    display: flex; flex-direction: column; align-items: center; gap: 1px;
  }
  .chevrons svg {
    width: 16px; height: 9px;
    opacity: 0;
    animation: chevronFlow 1.8s infinite;
  }
  .chevrons svg:nth-child(1) { animation-delay: 0s; }
  .chevrons svg:nth-child(2) { animation-delay: 0.22s; }
  .chevrons svg:nth-child(3) { animation-delay: 0.44s; }

  @keyframes chevronFlow {
    0%   { opacity: 0;   transform: translateY(-4px); }
    45%  { opacity: 0.9; transform: translateY(0); }
    100% { opacity: 0;   transform: translateY(5px); }
  }

  #quote {
    height: 100vh; display: flex; align-items: center; justify-content: flex-end;
    padding: 60px 12% 60px 20px;
    background: #ffffff;
    position: relative;
    overflow: hidden;
    scroll-snap-align: start;
    scroll-snap-stop: always;
  }
  /* 스크롤하면 왼쪽 아래에서 검은 원이 커지며 화면을 덮는 리빌 */
  .reveal-circle {
    position: absolute; top: 0; right: 0;
    width: 198vmax; height: 198vmax;
    background: #0e0d0c;
    border-radius: 50%;
    transform: translate(50%, -50%) scale(0);
    filter: blur(0px);
    transition: filter 0.18s ease-out;
    z-index: 1; will-change: transform, filter;
  }

  .quote-block {
    position: relative; z-index: 2;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    display: flex;
    gap: 34px;
    height: 100%;
    max-height: calc(100vh - 120px);
  }
  .quote-block p {
    font-family: "Noto Serif KR", "Batang", "바탕", serif;
    font-weight: 300;
    font-size: clamp(15px, 1.8vw, 21px);
    line-height: 1.75;
    letter-spacing: 0.12em;
    color: #ffffff;
    margin: 0;
  }
  .quote-mark {
    font-weight: 400;
    color: #ffffff;
  }

  /* ---------- 상단 바 (배경 없이 로고+내비만, 배경색과 상관없이 보이도록 blend) ---------- */
  .site-header {
    position: fixed; top: 0; left: 0; width: 100%; z-index: 50;
    opacity: 0; transform: translateY(-6px); pointer-events: none;
    transition: opacity 0.45s ease, transform 0.45s ease;
  }
  .site-header.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .site-header-inner {
    max-width: 1160px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px;
  }
  .site-logo { display: flex; align-items: center; }
  .site-logo img { height: 49px; width: auto; display: block; }
  .site-nav { display: flex; align-items: center; gap: 10px; }
  .site-nav a, .site-nav .dot {
    color: #171310;
    transition: color 0.3s ease;
  }
  .site-header.on-dark .site-nav a, .site-header.on-dark .site-nav .dot {
    color: #ffffff;
  }
  .site-nav a {
    text-decoration: none;
    font-size: 13px; letter-spacing: 0.08em;
  }
  .site-nav .dot { font-size: 10px; }
  .hamburger {
    display: none; flex-direction: column; justify-content: center; gap: 5px;
    width: 30px; height: 30px; background: none; border: none; cursor: pointer; padding: 0;
  }
  .hamburger span {
    width: 100%; height: 1px; display: block;
    background: #171310;
    transition: background 0.3s ease;
  }
  .site-header.on-dark .hamburger span { background: #ffffff; }
  .mobile-nav {
    display: none; flex-direction: column;
    max-width: 1160px; margin: 0 auto;
    padding: 0 28px 16px;
    background: #ffffff;
  }
  .mobile-nav a {
    padding: 13px 0; color: rgba(23,19,16,0.6); text-decoration: none;
    font-size: 13px; letter-spacing: 0.1em;
    border-top: 1px solid rgba(23,19,16,0.08);
  }
  .mobile-nav.open { display: flex; }

  @media (max-width: 720px) {
    .site-nav { display: none; }
    .hamburger { display: flex; }
  }
</style>
</head>
<body>

<div id="customCursor">
  <svg width="43" height="43" viewBox="0 0 48 48">
    <path d="M29.74,10.14 L37.86,18.26 L37.86,29.74 L29.74,37.86 L18.26,37.86 L10.14,29.74 L10.14,18.26 L18.26,10.14 Z" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>
</div>

<header class="site-header" id="siteHeader">
  <div class="site-header-inner">
    <a href="index.html" class="site-logo"><img src="가로로고.svg" alt="마주온"></a>
    <nav class="site-nav">
      <a href="story.html">스토리</a>
      <span class="dot">·</span>
      <a href="menu.html">메뉴</a>
      <span class="dot">·</span>
      <a href="store.html">스토어</a>
      <span class="dot">·</span>
      <a href="#">디지털 다도실</a>
    </nav>
    <button class="hamburger" id="hamburgerBtn" aria-label="메뉴 열기" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
  <nav class="mobile-nav" id="mobileNav">
    <a href="story.html">스토리</a>
    <a href="menu.html">메뉴</a>
    <a href="store.html">스토어</a>
    <a href="#">디지털 다도실</a>
  </nav>
</header>

<section id="hero">
  <main>
    <div class="art-wrap">
      <div class="frame" id="frame">
        <canvas id="c"></canvas>
      </div>
    </div>
    <div class="gallery-caption">《마주온 커피, 2026》 — 인터랙티브 캔버스</div>
    <div class="scroll-hint">
      <span>스크롤을 내리세요</span>
      <div class="chevrons">
        <svg viewBox="0 0 24 12"><path d="M2,2 L12,9 L22,2" fill="none" stroke="#171310" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg viewBox="0 0 24 12"><path d="M2,2 L12,9 L22,2" fill="none" stroke="#171310" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg viewBox="0 0 24 12"><path d="M2,2 L12,9 L22,2" fill="none" stroke="#171310" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
  </main>
</section>

<section id="quote">
  <div class="reveal-circle" id="revealCircle"></div>
  <div class="quote-block">
    <p><span class="quote-mark">『</span>마시는 종류만 달라졌을 뿐,</p>
    <p>즐기던 풍류는 마주해옵니다<span class="quote-mark">』</span></p>
  </div>
</section>


<script src="main.js"></script>
</body>
</html>
